- type: entity
  parent: [BaseNivalisGun, BaseSecurityContraband]
  id: NivalisMagnumImpuscaVana
  name: "M.A.G.N.U.M. 'Impusca Vana'"
  suffix: Nivalis, Artillerist
  description: A heavy hand cannon
  components:
  - type: Item
    size: Normal
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/energy_magnum.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-1
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/energy_magnum.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
  - type: Appearance
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 1.5
    projectileSpeed: 95
    cameraRecoilScalar: 1.4
    minAngle: 0
    maxAngle: 1
    angleIncrease: 1.5
    angleDecay: 4
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: AmmoCounter
  - type: NivalisPoolAmmoProvider
  - type: NivalisGun
    ammoType: Heavy
    maxAmmo: 6
    projectile: NivalisBulletMagnum
    limbDamage:
      types:
        Bullet: 34
    headshotDamage:
      types:
        Bullet: 90
  - type: NivalisAim
  - type: NivalisScatterDirection
    maxLeft: 2
    maxRight: 2
  - type: NivalisAimedScatter
    maxLeft: 0.5
    maxRight: 0.5
  - type: NivalisReload
    reloadDelay: 2.4
    breakOnMove: false
    walkSpeedMultiplier: 0.6
    sprintSpeedMultiplier: 0.6

- type: entity
  parent: BallisticBulletBaseNivalis
  id: NivalisBulletMagnum
  categories: [ HideSpawnMenu ]
  components:
  - type: Ammo
    muzzleFlash: NivalisMuzzleFlashRifle

