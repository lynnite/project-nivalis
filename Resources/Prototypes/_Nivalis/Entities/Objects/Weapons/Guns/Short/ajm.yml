- type: entity
  parent: [BaseNivalisGun]
  id: NivalisAjm9
  name: A.J.M. 9
  suffix: Nivalis
  description: Short
  components:
  - type: Sprite
    sprite: _Nivalis/Objects/Weapons/Guns/Short/ajm.rsi
    layers:
    - state: icon
  - type: Clothing
    sprite: _Nivalis/Objects/Weapons/Guns/Short/ajm.rsi
    quickEquip: false
    slots:
