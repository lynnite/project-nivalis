- type: entity
  name: scavenger pistol
  parent: BaseItem
  id: NivalisScavengerGun
  description: A battered energy pistol that drains charge as it fires and reloads its magazine on its own.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    layers:
      - state: base
  - type: Item
    sprite: Objects/Weapons/Guns/Pistols/viper.rsi
    size: Small
  - type: Gun
    fireRate: 4
    selectedMode: SemiAuto
    availableModes: [ SemiAuto ]
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: NivalisAutoReload
    reloadDelay: 2.0
    soundMagOut:
      path: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
    soundMagIn:
      path: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
  - type: BasicEntityAmmoProvider
    proto: BulletPistol
    capacity: 8
    count: 8
  - type: AmmoCounter
  - type: Tag
    tags:
    - Sidearm

