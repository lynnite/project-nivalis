- type: entity
  name: combat knife
  parent: [BaseItem, BaseSecurityContraband]
  id: NivalisScavengerCombatKnife
  description: A deadly knife intended for melee confrontations. Leaves its victims bleeding.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/combat_knife.rsi
    state: icon
  - type: Tag
    tags:
    - CombatKnife
    - Knife
  - type: NivalisMelee
    lightComboCount: 4
    lightComboInterval: 0.11
    lightComboRecovery: 0.45
    lightDamage:
      types: { Melee: 6 }
    lightStaminaDamage: 2
    heavyDamage:
      types: { Melee: 12 }
    heavyStaminaDamage: 4
    angle: 40
    range: 1.1
    animation: WeaponArcThrust
    wideAnimation: WeaponArcSlash
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: NivalisBleed
    damagePerSecond: 1
    duration: 40
  - type: MeleeChemicalInjector
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: Item
    size: Small
    sprite: Objects/Weapons/Melee/combat_knife.rsi
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]


