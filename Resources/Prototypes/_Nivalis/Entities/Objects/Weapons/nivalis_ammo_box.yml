# Nivalis ammo boxes.
# Interacting with these with E adds their ammo to the player's shared ammo pool
# (NivalisAmmoPoolComponent). They reuse existing box sprites.

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseNivalisAmmoBox
  components:
  - type: Item
    size: Small
  - type: NivalisAmmoBox
    amount: 12

# Light (handgun rounds) - pistol.rsi
- type: entity
  parent: BaseNivalisAmmoBox
  id: NivalisAmmoBoxLight
  name: light ammunition box
  description: A box of light handgun rounds. Adds to your shared ammo pool.
  components:
  - type: NivalisAmmoBox
    ammoType: Light
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi
    layers:
    - state: base

