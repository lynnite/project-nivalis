- type: entity
  abstract: true
  parent: BaseItem
  id: BaseNivalisGun
  components:
  - type: Sprite
  - type: Item
    size: Large
  - type: Clothing
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 4
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
  - type: AmmoCounter
  - type: NivalisPoolAmmoProvider
  - type: NivalisGun
    projectile: BallisticHitscanBaseNivalis
  - type: NivalisReload
    reloadDelay: 2
    breakOnMove: false
    walkSpeedMultiplier: 0.6
    sprintSpeedMultiplier: 0.6

- type: entity
  parent: [BaseNivalisGun, BaseMinorContraband]
  id: WeaponNivalisPistol
  name: field light pistol
  suffix: Nivalis
  description: A compact energy handgun that draws light rounds from your ammo pool.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/svalinn.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: NivalisGun
    ammoType: Light
    maxAmmo: 24
    projectile: BallisticHitscanBaseNivalis

- type: entity
  parent: [BaseNivalisGun, BaseSecurityContraband]
  id: WeaponNivalisRifle
  name: field medium rifle
  suffix: Nivalis
  description: A rugged assault rifle that draws medium rounds from your ammo pool.
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
  - type: Gun
    selectedMode: FullAuto
    fireRate: 5
    availableModes:
    - SemiAuto
    - FullAuto
  - type: NivalisGun
    ammoType: Medium
    maxAmmo: 40
    projectile: BallisticHitscanBaseNivalis

- type: entity
  parent: [BaseNivalisGun, BaseSecurityContraband]
  id: WeaponNivalisShotgun
  name: field shell scattergun
  suffix: Nivalis
  description: A heavy scattergun that draws shells from your ammo pool and fires a wide cone of pellets.
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/energy_shotgun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/energy_shotgun.rsi
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 2
    minAngle: 0
    maxAngle: 4
  - type: NivalisScatterGun
    projectilesPerShot: 5
    degreesScatter: 18
  - type: NivalisAim
  - type: NivalisScatterDirection
    maxLeft: 9
    maxRight: 9
  - type: NivalisAimedScatter
    maxLeft: 3
    maxRight: 3
  - type: NivalisGun
    ammoType: Shell
    maxAmmo: 8
    reloadAmount: 1
    projectile: NivalisScatterPelletBurst

- type: entity
  id: BasicHitscanNivalis
  name: basic hitscan
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanAmmo
  - type: HitscanBasicRaycast
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: _Nivalis/Objects/Weapons/Guns/Projectiles/ballistichitscan.rsi
      state: muzzle_laser
    travelFlash:
      sprite: _Nivalis/Objects/Weapons/Guns/Projectiles/ballistichitscan.rsi
      state: beam
    impactFlash:
      sprite: _Nivalis/Objects/Weapons/Guns/Projectiles/ballistichitscan.rsi
      state: impact_laser
  - type: HitscanReflect
  - type: HitscanBasicEffects

- type: entity
  parent: BasicHitscanNivalis
  id: LaserHitscanBaseNivalis
  name: basic laser ray
  categories: [ HideSpawnMenu ]
  components:
  - type: LaserProjectile

- type: entity
  parent: LaserHitscanBaseNivalis
  id: BallisticHitscanBaseNivalis
  name: base bullet
  categories: [ HideSpawnMenu ]
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Piercing: 7