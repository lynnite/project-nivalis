- type: entity
  abstract: true
  parent: BaseItem
  id: BaseNivalisGun
  components:
  - type: Sprite
  - type: Item
    size: Large
  - type: Clothing
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 4
    projectileSpeed: 80
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
  - type: AmmoCounter
  - type: NivalisPoolAmmoProvider
  - type: NivalisGun
    projectile: BallisticBulletBaseNivalis
  - type: NivalisReload
    reloadDelay: 2
    breakOnMove: false
    walkSpeedMultiplier: 0.6
    sprintSpeedMultiplier: 0.6
  - type: NivalisAim
  - type: NivalisScatterDirection
    maxLeft: 5
    maxRight: 5
  - type: NivalisAimedScatter
    maxLeft: 1.5
    maxRight: 1.5

- type: entity
  parent: [BaseNivalisGun, BaseMinorContraband]
  id: WeaponNivalisPistol
  name: field light pistol
  suffix: Nivalis
  description: A compact energy handgun that draws light rounds from your ammo pool.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/svalinn.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance
  - type: NivalisGun
    ammoType: Light
    maxAmmo: 24
    projectile: NivalisBulletLight

- type: entity
  parent: [BaseNivalisGun, BaseSecurityContraband]
  id: WeaponNivalisRifle
  name: field medium rifle
  suffix: Nivalis
  description: A rugged assault rifle that draws medium rounds from your ammo pool.
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/laser_gun.rsi
  - type: Gun
    selectedMode: FullAuto
    fireRate: 5
    availableModes:
    - SemiAuto
    - FullAuto
  - type: NivalisGun
    ammoType: Medium
    maxAmmo: 40
    projectile: NivalisBulletMedium

- type: entity
  parent: [BaseNivalisGun, BaseSecurityContraband]
  id: WeaponNivalisShotgun
  name: field shell scattergun
  suffix: Nivalis
  description: A heavy scattergun that draws shells from your ammo pool and fires a wide cone of pellets.
  components:
  - type: Item
    size: Large
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/energy_shotgun.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/energy_shotgun.rsi
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 2
    minAngle: 0
    maxAngle: 4
  - type: NivalisScatterGun
    projectilesPerShot: 5
    degreesScatter: 18
  - type: NivalisAim
  - type: NivalisScatterDirection
    maxLeft: 9
    maxRight: 9
  - type: NivalisAimedScatter
    maxLeft: 3
    maxRight: 3
  - type: NivalisGun
    ammoType: Shell
    maxAmmo: 8
    reloadAmount: 1
    projectile: NivalisScatterPelletBurstShell

- type: entity
  parent: BulletLaser
  id: NivalisScatterPelletBurst
  name: red scatter burst
  categories: [ HideSpawnMenu ]
  components:
  - type: ProjectileSpread
    proto: NivalisScatterPelletBurst
    count: 5
    spread: 18
  - type: Sprite
    sprite: _Nivalis/Objects/Weapons/Guns/Projectiles/shotgun.rsi
    layers:
    - state: scatter
      shader: unshaded
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Bullet: 7

- type: entity
  parent: NivalisScatterPelletBurst
  id: NivalisScatterPelletBurstShell
  categories: [ HideSpawnMenu ]
  components:
  - type: Ammo
    muzzleFlash: NivalisMuzzleFlashShotgun

- type: entity
  parent: BallisticBulletBaseNivalis
  id: NivalisBulletMedium
  categories: [ HideSpawnMenu ]
  components:
  - type: Ammo
    muzzleFlash: NivalisMuzzleFlashRifle

- type: entity
  parent: BaseBullet
  id: BallisticBulletBaseNivalis
  name: base fast bullet
  categories: [ HideSpawnMenu ]
  description: A very fast kinetic round. You shouldn't be able to read this.
  components:
  - type: Ammo
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Bullet: 7

- type: entity
  id: NivalisBulletTrail
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Effects
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _Nivalis/Objects/Weapons/Guns/Projectiles/ballistichitscan.rsi
      state: trail_thin
      autoAnimated: false
  - type: Tag
    tags:
    - HideContextMenu
