- type: entityTable # all placeholder so that its easier to put the actual entities here later when im tired
  id: NivalisCommonFoodTable
  table: !type:GroupSelector
    children:
    - id: FoodSnackBoritos
    - id: FoodSnackCheesie
    - id: FoodSnackChips
    - id: FoodSnackChocolateBar
    - id: FoodSnackRaisins
    - id: FoodSnackPistachios
    - id: FoodSnackNutribrick
    - id: FoodSnackEnergy

- type: entityTable
  id: NivalisAllFoodTable
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: NivalisCommonFoodTable
      weight: 0.85
    - !type:GroupSelector
      weight: 0.15
      children:
      - id: FoodSnackSyndi

- type: entityTable
  id: NivalisWaterTable
  table: !type:GroupSelector
    children:
    - id: DrinkWaterBottleFull
    - id: DrinkWaterCup
    - id: DrinkSodaWaterCan

- type: entityTable
  id: NivalisMedicalTable
  table: !type:GroupSelector
    children:
    - id: Ointment1
      weight: 1.5
    - id: Brutepack1
      weight: 1.5
    - id: Gauze1
      weight: 1.5
    - id: MedkitFilled
      weight: 0.5

- type: entityTable
  id: NivalisAmmoTable
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: NivalisAmmoBoxTable
      weight: 1.0

# Random Nivalis ammo box loot table. Spawns a single ammo box on the ground.
- type: entityTable
  id: NivalisAmmoBoxTable
  table: !type:GroupSelector
    children:
    - id: NivalisAmmoBoxLight
    - id: NivalisAmmoBoxShort
    - id: NivalisAmmoBoxLong
    - id: NivalisAmmoBoxSmall
    - id: NivalisAmmoBoxShell
    - id: NivalisAmmoBoxMedium
    - id: NivalisAmmoBoxHeavy

- type: entityTable
  id: NivalisHardwareTable
  table: !type:GroupSelector
    children:
    - id: CableApcStack
    - id: CableMVStack
    - id: SheetSteel
    - id: SheetGlass
    - id: ToolboxMechanicalFilled
    - id: ToolboxElectricalFilled

- type: entityTable
  id: NivalisScavengeTable
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: NivalisAllFoodTable
      weight: 0.45
    - !type:NestedSelector
      tableId: NivalisWaterTable
      weight: 0.30
    - !type:NestedSelector
      tableId: NivalisMedicalTable
      weight: 0.10
    - !type:NestedSelector
      tableId: NivalisAmmoTable
      weight: 0.10
    - !type:NestedSelector
      tableId: NivalisHardwareTable
      weight: 0.05

# Container entities that hold the loot, spawned instead of dropping items on the ground.
- type: entity
  parent: CrateGenericSteel
  id: CrateNivalisScavenge
  name: scavenged supply crate
  suffix: Nivalis
  description: A battered crate packed with whatever could be scavenged from Nivalis.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: NivalisScavengeTable

- type: entity
  parent: CrateFreezer
  id: CrateNivalisFood
  name: food crate
  suffix: Nivalis
  description: A crate full of whatever stored snacks survived the storm.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: NivalisAllFoodTable

- type: entity
  parent: CratePlastic
  id: CrateNivalisWater
  name: water crate
  suffix: Nivalis
  description: A crate of salvaged drinking water.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: NivalisWaterTable

- type: entity
  parent: CrateMedical
  id: CrateNivalisMedical
  name: medical crate
  suffix: Nivalis
  description: A scavenged medical crate with basic supplies.
  components:
  - type: EntityTableContainerFill
    containers:
