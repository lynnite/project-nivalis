        tableId: NivalisHardwareTable

- type: entity
  parent: MarkerBase
  id: SpawnNivalisScavenge
  name: scavenge loot
  suffix: Nivalis
  description: A random scavenge loot spawn when a Nivalis survivor round runs.
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Storage/Crates/generic.rsi
      state: icon
  - type: EntityTableSpawner
    table: !type:GroupSelector
      prob: 0.8
      children:
      - id: CrateNivalisScavenge
    offset: 0.0

