# Nivalis melee combat compound task. Mirrors the standard MeleeCombatCompound but uses the
# NivalisMeleeOperator so NPCs swing Nivalis melee weapons (spear/knife/pipe/ice-axe/cleaver) which
# don't carry a regular MeleeWeapon component.
- type: htnCompound
  id: NivalisMeleeCombatCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyMeleeTargets
        - !type:HTNCompoundTask
          task: NivalisBeforeMeleeAttackCompound

- type: htnCompound
  id: NivalisBeforeMeleeAttackCompound
  branches:
    - preconditions:
        - !type:BuckledPrecondition
          isBuckled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UnbuckleOperator
            shutdownState: TaskFinished

    - preconditions:
        - !type:PulledPrecondition
          isPulled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UnPullOperator
            shutdownState: TaskFinished

    - preconditions:
        - !type:InContainerPrecondition
          isInContainer: true
      tasks:
        - !type:HTNCompoundTask
          task: EscapeCompound


    - tasks:
        - !type:HTNCompoundTask
          task: NivalisMeleeAttackTargetCompound


- type: htnCompound
  id: NivalisMeleeAttackTargetCompound
  branches:
    - preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange
        - !type:HTNPrimitiveTask
          operator: !type:NivalisMeleeOperator
            targetKey: Target
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: MeleeRange
          services:
            - !type:UtilityService
              id: MeleeService
              proto: NearbyMeleeTargets
              key: Target

- type: htnCompound
  id: NivalisGunnerCombatCompound
  branches:
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:NeedToRackBoltPrecondition
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:RackBoltOperator

    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:WieldedPrecondition
          wielded: false
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:WieldOperator

    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: GunCombatCompound

    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
          invert: true
      tasks:
        - !type:HTNCompoundTask
          task: PickupGunCompound

- type: htnCompound
  id: NivalisScavengerHostileCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: NivalisGunnerCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: NivalisMeleeCombatCompound
    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound
